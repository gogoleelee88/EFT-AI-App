              - "pdf"
          type: "array"
          title: "Formats"
        medical_disclaimer:
          type: "string"
          title: "Medical Disclaimer"
      type: "object"
      required:
        - "job_id"
        - "status"
        - "created_at"
        - "medical_disclaimer"
      title: "ExportJobResponse"
