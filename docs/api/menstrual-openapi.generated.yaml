components:
  schemas:
    BleedingLogRequest:
      properties:
        date:
          type: "string"
          format: "date"
          title: "Date"
        type:
          type: "string"
          enum:
            - "menstruation_start"
            - "menstruation_end"
            - "spotting_start"
            - "spotting_end"
          title: "Type"
          description: "menstruation_start/end or spotting_start/end"
        flow_level:
          type: "integer"
          maximum: 4.0
          minimum: 0.0
          title: "Flow Level"
        cramp_level:
          anyOf:
            -
              type: "integer"
              maximum: 5.0
              minimum: 0.0
            -
              type: "null"
          title: "Cramp Level"
        pain_areas:
          items:
            type: "string"
            enum:
              - "lower_abdomen"
              - "back"
              - "headache"
              - "breast"
              - "other"
          type: "array"
          title: "Pain Areas"
        notes:
          anyOf:
            -
              type: "string"
              maxLength: 2000
            -
              type: "null"
          title: "Notes"
        meds_taken:
          items:
            type: "string"
          type: "array"
          title: "Meds Taken"
      type: "object"
      required:
        - "date"
        - "type"
        - "flow_level"
      title: "BleedingLogRequest"
