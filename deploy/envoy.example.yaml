# Envoy example configuration snippet ensuring /api/suds/record allows POST & OPTIONS
# Apply to your active envoy.yaml (backup first!).
static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/api/suds/record"
                          route:
                            cluster: backend_fastapi
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - prefix: "https://www.moodtalk.app"
                              allow_methods: "GET,POST,OPTIONS"
                              allow_headers: "content-type,authorization"
                              expose_headers: "x-actions-hash,x-debug-actions"
                              allow_credentials: true
                        - match:
                            prefix: "/api/"
                          route:
                            cluster: backend_fastapi
                http_filters:
                  - name: envoy.filters.http.router
  clusters:
    - name: backend_fastapi
      connect_timeout: 1s
      type: logical_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: backend_fastapi
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8000
# Allow any HTTP method to pass through. If RBAC is used, ensure POST/OPTIONS are included.
