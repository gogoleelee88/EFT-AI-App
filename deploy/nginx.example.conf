# Nginx example: forward /api/* to FastAPI without rewriting prefixes
# 1) backup current nginx.conf
# 2) merge this snippet into the server{} block handling moodtalk.app
# 3) reload nginx (sudo systemctl reload nginx)

server {
    listen 443 ssl;
    server_name www.moodtalk.app moodtalk.app;

    location /api/ {
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Allow POST/OPTIONS without restriction
        limit_except GET POST OPTIONS {
            deny all;
        }

        # CORS preflight passthrough
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://www.moodtalk.app" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
