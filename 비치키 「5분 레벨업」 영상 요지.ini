제목:
묘하게 매력적인 사람의 세 가지 비밀

주제 한 줄 요약:
섹시함은 외모가 아니라 목소리·시선·지적 매력에서 드러난다.

핵심 주장(3–5개 불릿):

* 단단하고 힘 있는 목소리는 사람의 이미지를 크게 바꾼다.
* 아이컨택은 인상 조절과 자신감 표현의 핵심이다.
* 지적 매력을 드러내는 태도는 자연스러운 호감을 이끈다.
* 외적 조건보다 내적 표현과 태도가 매력을 형성한다.

근거/사례 요지(2–4개):

* 복식호흡을 활용하면 목소리가 깊어지고 신뢰감을 주는 발성이 가능하다.
* 시선을 직접 마주하기 어렵다면 미간이나 콧잔등을 바라보는 ‘모드 전환 아이컨택’이 도움이 된다.
