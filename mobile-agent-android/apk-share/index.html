<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EFT Agent APK Install</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;line-height:1.5;">
  <h2>EFT Local Alarm Agent (Android)</h2>
  <p>아래 버튼으로 APK를 다운로드/설치하세요.</p>
  <p><a id="apk-link" href="#" style="display:inline-block;padding:12px 16px;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px;">APK 다운로드 (latest)</a></p>
  <p>직접 링크: <code id="apk-code"></code></p>
  <p>업데이트 시: <code>sync_and_serve.bat</code> 실행(최신 APK 자동 반영)</p>
  <p>처음 설치 시: 설정 > 보안 > 알 수 없는 앱 설치 허용(브라우저/파일관리자)</p>
  <p>QR 다운로드 링크:</p>
  <img id="apk-qr" src="" alt="apk qr" style="width:260px;height:260px;border:1px solid #ddd;" />
  <script>
    (function () {
      const origin = window.location.origin || 'http://localhost:8787';
      const apkUrl = `${origin}/latest.apk?v=${Date.now()}`;
      const qrApi =
        'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=1&data=' +
        encodeURIComponent(apkUrl);
      const qrImg = document.getElementById('apk-qr');
      const link = document.getElementById('apk-link');
      const code = document.getElementById('apk-code');
      if (link) {
        link.href = apkUrl;
        link.textContent = `APK 다운로드 (latest)`;
      }
      if (code) {
        code.textContent = apkUrl;
      }
      if (qrImg) {
        qrImg.src = qrApi;
      }
    })();
  </script>
</body>
</html>
