# ===================================================================
# Nginx manifest.json CORS 설정
# ===================================================================
# 목적: PWA manifest.json CORS 오류 해결
# 위치: /etc/nginx/sites-available/moodtalk.app
# ===================================================================

# === manifest.json CORS 헤더 추가 ===
location = /manifest.json {
    # 정적 파일 제공
    root /home/moodtalk/tocmood/moodtalk-public/static-frontend;

    # CORS 헤더 추가 (모든 오리진 허용)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # 캐시 설정 (1시간)
    add_header Cache-Control "public, max-age=3600" always;

    # Content-Type 명시
    add_header Content-Type "application/manifest+json" always;

    # OPTIONS 메서드 처리 (preflight request)
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age "3600" always;
        add_header Content-Length 0;
        return 204;
    }
}

# === 모든 JSON 파일에 CORS 추가 (선택사항) ===
location ~* \.json$ {
    # 정적 파일 제공
    root /home/moodtalk/tocmood/moodtalk-public/static-frontend;

    # CORS 헤더
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # 캐시 (짧게)
    add_header Cache-Control "public, max-age=600" always;
}

# ===================================================================
# 적용 방법
# ===================================================================
#
# 1. 서버에 SSH 접속:
#    ssh -p 20233 moodtalk@modulabs.ddns.net
#
# 2. Nginx 설정 파일 편집:
#    sudo nano /etc/nginx/sites-available/moodtalk.app
#
# 3. 위 location 블록을 server {} 블록 안에 추가
#    (기존 location / 블록보다 위에 배치)
#
# 4. 설정 검증:
#    sudo nginx -t
#
# 5. Nginx 재로드:
#    sudo systemctl reload nginx
#
# 6. 테스트:
#    curl -I https://www.moodtalk.app/manifest.json
#    # Access-Control-Allow-Origin: * 헤더 확인
#
# ===================================================================
# 성공 기준
# ===================================================================
#
# ✅ HTTP 200 OK
# ✅ Access-Control-Allow-Origin: * 헤더 존재
# ✅ Content-Type: application/manifest+json
# ✅ 브라우저 콘솔에서 CORS 오류 없음
# ✅ PWA 설치 프롬프트 정상 작동
#
# ===================================================================
# 트러블슈팅
# ===================================================================
#
# 문제 1: "Nginx: unknown directive"
# → location 블록을 server {} 안에 넣었는지 확인
#
# 문제 2: 여전히 CORS 오류
# → Cloudflare 캐시 퍼지:
#    curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
#      -H "Authorization: Bearer ${CF_API_TOKEN}" \
#      -H "Content-Type: application/json" \
#      --data '{"files":["https://www.moodtalk.app/manifest.json"]}'
#
# 문제 3: 404 Not Found
# → root 경로가 정확한지 확인:
#    ls -la /home/moodtalk/tocmood/moodtalk-public/static-frontend/manifest.json
#
# ===================================================================
