# ===================================================================
# Nginx 헬스체크 엔드포인트 설정
# ===================================================================
# 목적: Cloudflare/로드밸런서/외부 모니터링 도구용 헬스체크
# 위치: /etc/nginx/sites-available/moodtalk.app
# ===================================================================

# === FastAPI 헬스체크 (퍼블릭 노출) ===
location = /health {
    # FastAPI /health 엔드포인트로 프록시
    proxy_pass http://127.0.0.1:8000/health;

    # 헤더 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 캐시 절대 금지 (항상 최신 상태 확인)
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;

    # CORS 허용 (모니터링 도구 접근)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    # 타임아웃 (헬스체크는 빠르게)
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# === API 헬스체크 (대체 경로) ===
location = /api/health {
    # 동일한 설정
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# === LLM 헬스체크 (선택사항) ===
location = /llm/health {
    # LLM 서버 헬스체크
    proxy_pass http://127.0.0.1:8002/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;

    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}

# === Nginx 자체 헬스체크 (stub_status) ===
# 내부 모니터링용, 외부 접근 차단
location = /nginx-health {
    stub_status;

    # 로컬호스트에서만 접근 가능
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # 로그 남기지 않음
    access_log off;
}

# ===================================================================
# 적용 방법
# ===================================================================
#
# 1. 기존 설정 파일에 위 블록 추가:
#    sudo nano /etc/nginx/sites-available/moodtalk.app
#
# 2. 설정 검증:
#    sudo nginx -t
#
# 3. Nginx 재로드:
#    sudo systemctl reload nginx
#
# 4. 테스트:
#    curl https://moodtalk.app/health
#    curl https://moodtalk.app/api/health
#    curl https://moodtalk.app/llm/health
#    curl http://localhost/nginx-health  # 내부 전용
#
# ===================================================================
# 성공 기준
# ===================================================================
#
# ✅ /health → HTTP 200, JSON 응답 {"ok":true} 또는 {"status":"ok"}
# ✅ /api/health → 동일한 응답
# ✅ /llm/health → HTTP 200 (LLM 서버 실행 시)
# ✅ Cache-Control 헤더: no-store 확인
# ✅ 외부 모니터링 도구(Uptime-Kuma 등)에서 정상 접근
#
# ===================================================================
# Cloudflare Health Check 설정 (선택사항)
# ===================================================================
#
# Cloudflare Dashboard → Traffic → Health Checks
#
# 1. Add a Health Check:
#    - Monitor: https://moodtalk.app/health
#    - Interval: 60 seconds
#    - Retries: 2
#    - Expected Codes: 200
#    - Expected Body: "ok" 또는 "status"
#
# 2. Notification:
#    - Email/Webhook 설정
#    - Failure threshold: 2 consecutive failures
#
# 3. Monitor Regions:
#    - All regions (기본값)
#
# ✅ 성공 기준: Cloudflare Health Checks에서 "Healthy" 상태
#
# ===================================================================
# Uptime-Kuma 연동 설정
# ===================================================================
#
# 1. Uptime-Kuma 대시보드 접속: http://localhost:3001
#
# 2. Add New Monitor:
#    Monitor Type: HTTP(s)
#    Friendly Name: EFT AI - API Health
#    URL: https://moodtalk.app/health
#    Heartbeat Interval: 60 (초)
#    Retries: 2
#    Expected Response Code: 200
#    Expected Response Body: "ok" 또는 "status"
#
# 3. Notification 설정:
#    Settings → Notifications
#    Add: Telegram/Discord/Email/Slack
#    Test Notification 성공 확인
#
# 4. 추가 모니터:
#    - LLM Health: https://moodtalk.app/llm/health
#    - Frontend: https://moodtalk.app (정적 페이지)
#
# ✅ 성공 기준: 모든 모니터 Green 상태, 알림 테스트 성공
#
# ===================================================================
# 로드밸런서 헬스체크 (선택사항)
# ===================================================================
#
# AWS ELB/ALB:
# - Health Check Path: /health
# - Health Check Protocol: HTTPS
# - Healthy Threshold: 2
# - Unhealthy Threshold: 2
# - Timeout: 5 seconds
# - Interval: 30 seconds
#
# Google Cloud Load Balancer:
# - Request path: /health
# - Port: 443
# - Check interval: 30s
# - Timeout: 5s
# - Healthy threshold: 2
# - Unhealthy threshold: 2
#
# ===================================================================
