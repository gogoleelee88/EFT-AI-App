# ===================================================================
# systemd 자동재시작 설정 - EFT AI API 서버
# ===================================================================
# 파일: ~/.config/systemd/user/eft-api.service
# 목적: 서비스 장애 시 자동 복구
# ===================================================================

[Unit]
Description=EFT AI FastAPI Server
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
WorkingDirectory=/home/moodtalk/tocmood/moodtalk-public
ExecStart=/home/moodtalk/tocmood/moodtalk-public/.venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000

# === 자동재시작 정책 (핵심!) ===
Restart=always
RestartSec=3

# 실패 10회 이상 시 30분 대기 (재시작 폭풍 방지)
StartLimitInterval=600
StartLimitBurst=10

# === Watchdog (선택사항) ===
# FastAPI에서 sd_notify로 30초마다 살아있음을 알려야 함
# WatchdogSec=45

# === 환경변수 ===
Environment="DEBUG=false"
Environment="PYTHONUNBUFFERED=1"
Environment="PYTHONUTF8=1"

# === 리소스 제한 (선택) ===
MemoryMax=2G
CPUQuota=200%

# === 로그 설정 ===
StandardOutput=journal
StandardError=journal
SyslogIdentifier=eft-api

[Install]
WantedBy=default.target

# ===================================================================
# 적용 방법:
# 1. mkdir -p ~/.config/systemd/user
# 2. cp systemd-service-example.conf ~/.config/systemd/user/eft-api.service
# 3. systemctl --user daemon-reload
# 4. systemctl --user enable eft-api  # 부팅 시 자동 시작
# 5. systemctl --user start eft-api
# 6. systemctl --user status eft-api
#
# 성공 기준:
# - systemctl --user status eft-api → Active: active (running)
# - 서비스 kill -9 후 3초 내 자동 재시작
# ===================================================================
