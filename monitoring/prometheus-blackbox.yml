# ===================================================================
# 사용 방법
# ===================================================================
#
# 1. 설정 파일 생성:
#    mkdir -p ~/eft-monitoring
#    cd ~/eft-monitoring
#
#    # 위의 blackbox-config.yml 내용 저장
#    # 위의 prometheus-config.yml 내용 저장
#
# 2. Docker Compose 실행:
#    docker-compose -f prometheus-blackbox.yml up -d
#
# 3. 접속:
#    - Prometheus: http://localhost:9090
#    - Blackbox: http://localhost:9115
#    - Grafana: http://localhost:3002 (admin/admin)
#
# 4. Grafana 대시보드 설정:
#    - Data Source 추가: Prometheus (http://prometheus:9090)
#    - Dashboard Import: ID 7587 (Prometheus Blackbox Exporter)
#
# 5. 유용한 PromQL 쿼리:
#    # 성공률 (24시간)
#    100 * (sum(rate(probe_success{job="api-health"}[24h])) / sum(rate(probe_duration_seconds_count{job="api-health"}[24h])))
#
#    # 평균 응답 시간
#    probe_duration_seconds{job="api-health"}
#
#    # SSL 인증서 만료일 (일 단위)
#    (probe_ssl_earliest_cert_expiry{job="frontend"} - time()) / 86400
#
# 6. 알림 설정 (alertmanager):
#    # Prometheus에서 Alertmanager 연동 후 규칙 추가
#    # API 다운 시 슬랙/이메일 알림

# ===================================================================
# 성공 기준
# ===================================================================
#
# ✅ Blackbox Exporter:
#    - http://localhost:9115/metrics → Prometheus 메트릭 표시
#    - http://localhost:9115/probe?target=https://moodtalk.app&module=http_2xx → 수동 테스트 성공
#
# ✅ Prometheus:
#    - http://localhost:9090/targets → 모든 타겟 UP 상태
#    - http://localhost:9090/graph → probe_success 쿼리 결과 1 (성공)
#
# ✅ Grafana:
#    - http://localhost:3002 → 대시보드에서 실시간 그래프 확인
#    - API 응답 시간, 성공률, SSL 만료일 모니터링
