# ===================================================================
# Prometheus Blackbox Exporter 설정 (선택사항)
# ===================================================================
# 목적: 외부에서 엔드포인트 상태 모니터링 + 메트릭 수집
# 사용: Docker Compose로 실행
# 접속: http://localhost:9115 (Blackbox UI)
#       http://localhost:9090 (Prometheus UI)
# ===================================================================

version: '3.8'

services:
  # Prometheus Blackbox Exporter
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: always
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox-config.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - monitoring

  # Prometheus 서버
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring

  # Grafana (시각화)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3002:3000"  # 3001은 Uptime-Kuma가 사용 중
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

# ===================================================================
# Blackbox Exporter 설정 파일
# 파일: blackbox-config.yml
# ===================================================================
# 아래 내용을 blackbox-config.yml에 저장:
#
# modules:
#   # HTTP GET 체크 (기본)
#   http_2xx:
#     prober: http
#     timeout: 5s
#     http:
#       valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
#       valid_status_codes: []  # 기본: 2xx만 성공
#       method: GET
#       fail_if_ssl: false
#       fail_if_not_ssl: true  # HTTPS 필수
#       tls_config:
#         insecure_skip_verify: false
#
#   # HTTP POST 체크 (API 테스트)
#   http_post_2xx:
#     prober: http
#     timeout: 10s
#     http:
#       method: POST
#       headers:
#         Content-Type: application/json
#       body: '{"test": true}'
#       valid_status_codes: [200, 201]
#
#   # TCP 포트 체크
#   tcp_connect:
#     prober: tcp
#     timeout: 5s
#
#   # ICMP Ping
#   icmp:
#     prober: icmp
#     timeout: 5s

