name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Print Node & npm info
        run: |
          node -v
          npm -v

      - name: Install (root)
        run: npm ci

      - name: Build (frontend)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm --prefix frontend run build:ci

      - name: Build sanity check
        run: |
          echo "Checking build output..."
          ls -la frontend/dist/
          echo "Main files:"
          find frontend/dist -name "*.html" -o -name "*.js" -o -name "*.css" | head -10

      - name: Check for harmful /eft-guide references in build
        run: |
          echo "Scanning build output for harmful eft-guide references..."

          # 정상적인 React Router path는 제외하고, 하드코드 링크만 찾기
          harmful_patterns=(
            'href="/eft-guide"'
            'navigate("/eft-guide")'
            'to="/eft-guide"'
            'window.location.*eft-guide'
            'location.href.*eft-guide'
          )

          found_harmful=false
          for pattern in "${harmful_patterns[@]}"; do
            if grep -r -n --include="*.{html,js,css}" --exclude="*.map" "$pattern" frontend/dist/; then
              echo "❌ Found harmful eft-guide reference: $pattern"
              found_harmful=true
            fi
          done

          if $found_harmful; then
            echo "❌ Harmful eft-guide references found. Fix before deploy."
            exit 1
          else
            echo "✅ No harmful eft-guide references found."
            echo "ℹ️  React Router paths are allowed for defensive redirects."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: SSH sanity check
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT }} \
            -i ~/.ssh/id_rsa \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH OK on $(hostname)'"

      - name: Deploy static files via rsync (hard sync)
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --omit-dir-times --no-perms --no-owner --no-group
          path: frontend/dist/
          remote_path: /home/moodtalk/tocmood/moodtalk-public/static-frontend/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Purge Cloudflare cache
        run: |
          echo "Purging Cloudflare cache..."
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if echo "$response" | grep -q '"success":true'; then
            echo "✅ Cloudflare cache purged successfully"
            echo "Response: $response"
          else
            echo "❌ Cloudflare cache purge failed: $response"
            exit 1
          fi

          echo "Waiting 10 seconds for cache propagation..."
          sleep 10

      - name: Detect live JS bundle path
        id: livejs
        run: |
          set -euo pipefail
          DOMAIN="https://moodtalk.app"
          JS_PATH=$(curl -fsSL "$DOMAIN/" | grep -oE '/assets/index-[^"]*\.js' | head -1)
          echo "JS_PATH=$JS_PATH" >> $GITHUB_OUTPUT
          echo "Live JS: $JS_PATH"

      - name: Download live bundle
        run: |
          set -euo pipefail
          DOMAIN="https://moodtalk.app"
          curl -fsS "$DOMAIN${{ steps.livejs.outputs.JS_PATH }}" -o live.js
          echo "Bundle size: $(wc -c < live.js) bytes"

      - name: Verify /eft-guide redirect (HTTP headers)
        run: |
          set -euo pipefail
          echo "Testing /eft-guide redirect..."

          URL=https://www.moodtalk.app/eft-guide

          # GET 요청으로 상태 코드 확인 (HEAD 요청 405 에러 방지, 리다이렉트 따라가지 않음)
          response=$(curl -sS -w '\nSTATUS:%{http_code}\nLOCATION:%{redirect_url}' "$URL")
          status=$(echo "$response" | grep '^STATUS:' | cut -d: -f2)
          location=$(echo "$response" | grep '^LOCATION:' | cut -d: -f2-)

          echo "status=$status"
          echo "location=$location"

          if [[ "$status" =~ ^30[12378]$ ]] && [[ "$location" == *"/ar-holistic"* ]]; then
            echo "✅ Edge redirect OK -> $location"
          else
            echo "❌ Edge redirect not configured (status=$status, location=$location)"
            exit 1
          fi

          # Check for hard-coded links in HTML only
          if curl -sS https://www.moodtalk.app/ | grep -q 'href="/eft-guide"'; then
            echo "❌ Hard link to /eft-guide found in HTML"
            exit 1
          else
            echo "✅ No hard link in HTML"
          fi

      - name: Health check (homepage)
        run: |
          curl -sS -I https://moodtalk.app | head -n 20
          curl -sS https://moodtalk.app | head -n 20