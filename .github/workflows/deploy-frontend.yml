name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Print Node & npm info
        run: |
          node -v
          npm -v

      - name: Install (root)
        run: npm ci

      - name: Build (frontend)
        run: npm --prefix frontend run build:ci -- --force

      - name: Sanity check ensure no /eft-guide in dist
        run: |
          echo "Searching 'eft-guide' in dist..."
          grep -R "eft-guide" frontend/dist || echo "OK: no 'eft-guide' in dist"

      - name: Deploy static files via rsync (auto-delete extras)
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Purge Cloudflare cache
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" -H "Content-Type: application/json" --data '{"purge_everything":true}'

      - name: Health check (homepage)
        run: |
          curl -sS -I https://moodtalk.app | head -n 20
          curl -sS https://moodtalk.app | head -n 20