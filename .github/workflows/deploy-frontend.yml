name: Deploy Frontend to moodtalk.app

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'     # 🔒 main에서만 실행
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'           # EBADENGINE 경고 제거
          cache: 'npm'

      # ⚠️ lockfile이 리포지토리 루트에 있는 구조로 보입니다.
      - name: Install deps (root)
        run: npm ci

      - name: Build (frontend)
        run: npm --prefix frontend run build:ci

      # TODO: 배포 단계(서버/rsync/S3 등) 유지