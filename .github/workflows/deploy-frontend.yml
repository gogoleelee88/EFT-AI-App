name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Print Node & npm info
        run: |
          node -v
          npm -v

      - name: Install (root)
        run: npm ci

      - name: Build (frontend)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm --prefix frontend run build:ci

      - name: Copy _redirects to dist
        run: |
          echo "Copying _redirects file to dist..."
          cp frontend/public/_redirects frontend/dist/_redirects
          echo "✅ _redirects copied successfully"
          ls -lh frontend/dist/_redirects


      - name: Build sanity check
        run: |
          echo "Checking build output..."
          ls -la frontend/dist/
          echo "Main files:"
          find frontend/dist -name "*.html" -o -name "*.js" -o -name "*.css" | head -10

      - name: Check for harmful /eft-guide references in build
        run: |
          echo "Scanning build output for harmful eft-guide references..."

          # 정상적인 React Router path는 제외하고, 하드코드 링크만 찾기
          harmful_patterns=(
            'href="/eft-guide"'
            'navigate("/eft-guide")'
            'to="/eft-guide"'
            'window.location.*eft-guide'
            'location.href.*eft-guide'
          )

          found_harmful=false
          for pattern in "${harmful_patterns[@]}"; do
            if grep -r -n --include="*.{html,js,css}" --exclude="*.map" "$pattern" frontend/dist/; then
              echo "❌ Found harmful eft-guide reference: $pattern"
              found_harmful=true
            fi
          done

          if $found_harmful; then
            echo "❌ Harmful eft-guide references found. Fix before deploy."
            exit 1
          else
            echo "✅ No harmful eft-guide references found."
            echo "ℹ️  React Router paths are allowed for defensive redirects."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: SSH sanity check
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT }} \
            -i ~/.ssh/id_rsa \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH OK on $(hostname)'"

      - name: Deploy static files via rsync (hard sync)
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --omit-dir-times --no-perms --no-owner --no-group
          path: frontend/dist/
          remote_path: /home/moodtalk/tocmood/moodtalk-public/static-frontend/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Purge Cloudflare cache
        run: |
          echo "Purging Cloudflare cache..."
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if echo "$response" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "✅ Cloudflare cache purged successfully"
            echo "Response: $response"
          else
            echo "❌ Cloudflare cache purge failed: $response"
            exit 1
          fi

          echo "Waiting 10 seconds for cache propagation..."
          sleep 10

