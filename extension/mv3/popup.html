<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EFT Work Guide</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>업무 막힘 가이드</h1>

      <label class="label" for="goal">목표 (필수)</label>
      <textarea id="goal" rows="3" placeholder="예: 네이버 회원가입 화면에서 본인인증 단계로 이동하고 싶어요"></textarea>

      <label class="label" for="context">상황 설명 (선택)</label>
      <textarea id="context" rows="2" placeholder="예: 로그인 완료, 가입 버튼은 찾았지만 다음 단계가 헷갈림"></textarea>

      <div class="row">
        <label class="label" for="steps">최대 단계</label>
        <select id="steps">
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <label class="label" for="apiBase">API Base</label>
      <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000/api" />

      <p id="status" class="status"></p>

      <div class="actions">
        <button id="startBtn" class="primary" type="button">현재 탭 가이드 시작</button>
        <button id="closeBtn" type="button">오버레이 닫기</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
  </html>
